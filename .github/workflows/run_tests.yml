name: python autotests ui

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: choose tests set
        required: true
        type: choice
        default: all
        options:
          - smoke
          - all
permissions:
      contents: read
      pages: write
      id-token: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run ui tests
    steps:
    - name: Checkout autests
      uses: actions/checkout@v6
    - name: Set up Python environment
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies.
      run: pip install -r requirements.txt
    - name: run all tests
      if: "github.event.inputs.deployment_target=='all'"
      run: pytest --alluredir=allure-results
      continue-on-error: true
    - name: run smoke tests
      if: "github.event.inputs.deployment_target=='smoke'"
      run: pytest -m smoke --alluredir=allure-results
      continue-on-error: true

      
    - name: Download previous Allure history
      continue-on-error: true
      run: |
        sudo apt-get install unzip -y

        ARTIFACT_ID=$(curl -L \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=github-pages" \
          | python -c "import sys, json; data=json.load(sys.stdin); print(data['artifacts'][0]['id'] if data['artifacts'] else '')")

        if [ ! -z "$ARTIFACT_ID" ]; then
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip \
            -o pages.zip

          mkdir old_pages
          mkdir pages_history

          unzip pages.zip -d old_pages
          tar -xvf old_pages/artifact.tar -C pages_history

          if [ -d "pages_history/history" ]; then
            cp -r pages_history/history allure-results
          fi
        fi

        
    - name: Install Java
      uses: actions/setup-java@v5
      with:
        distribution: 'microsoft' # See 'Supported distributions' for available options
        java-version: '17'
    - name: Install Allure
      run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.41.0/allure-2.41.0.tgz && sudo tar -zxvf allure-2.41.0.tgz -C /opt/ && sudo ln -s /opt/allure-2.41.0/bin/allure /usr/bin/allure

    - name: Generate report
      run: allure generate -c allure-results -o _site
    - name: Save allure report
      uses: actions/upload-artifact@v7
      with:
        name: _site
        path: _site
        retention-days: 1

  publish-report:
    name: Report publication
    runs-on: ubuntu-latest
    needs: run-tests

      
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: _site
          path: _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  
        
